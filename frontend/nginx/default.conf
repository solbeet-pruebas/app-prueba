# Sirve el build estático de Vite. Corre como usuario no root en el puerto 8080
# (imagen nginx-unprivileged). El ruteo de /api al backend lo hace el ingress en
# producción; en docker compose se agrega con un archivo en conf.d/extra/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/conf.d/extra/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets con hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
